; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 115200

board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/WebServer/src"
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src"
    -include "${PROJECT_DIR}/include/WebServerLimits.h"

lib_deps =
    madhephaestus/ESP32Servo@3.2.1
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit SH110X@2.1.14
    adafruit/Adafruit MPU6050@2.2.6
    nrf24/RF24@1.6.1
